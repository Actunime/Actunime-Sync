name: Release

# Secrets requis (Settings → Secrets and variables → Actions) :
#   - GH_TOKEN          : PAT avec scope `repo` (utilisé par semantic-release pour pousser le tag + créer la release)
#   - BETA_API_URL      : ex. https://api.beta.actunime.fr
#   - BETA_WEB_URL      : ex. https://beta.actunime.fr
#   - PROD_API_URL      : ex. https://api.actunime.fr
#   - PROD_WEB_URL      : ex. https://actunime.fr
# Le workflow choisit BETA_* ou PROD_* selon la branche poussée.

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - beta
      - production

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Token requis pour que semantic-release puisse pousser le commit
          # `chore(release): X.Y.Z` + le tag.
          persist-credentials: false

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Récupération du chemin du store pnpm
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache du store pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Installation des dépendances
        run: pnpm install --no-frozen-lockfile

      - name: Calcul de la prochaine version
        # Lit le `nextRelease.version` que semantic-release calculerait. Doit
        # tourner AVANT le build pour que `manifest.config.ts` (qui lit
        # `package.json`) embarque la bonne version dans le `manifest.json`
        # final. Sans ça, le zip publié contient la version précédente.
        id: next_version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          NEXT_VERSION=$(pnpm dlx semantic-release --dry-run | grep "next release version is" | sed -E 's/.*is ([0-9].*)/\1/' | tail -n1)
          if [ -z "$NEXT_VERSION" ]; then
            echo "Aucune nouvelle version à publier — fin du job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump de package.json à la prochaine version
        if: steps.next_version.outputs.skip != 'true'
        run: pnpm pkg set version=${{ steps.next_version.outputs.version }}

      - name: Build de l'extension
        if: steps.next_version.outputs.skip != 'true'
        env:
          VITE_API_URL: ${{ github.ref_name == 'production' && secrets.PROD_API_URL || secrets.BETA_API_URL }}
          VITE_WEB_URL: ${{ github.ref_name == 'production' && secrets.PROD_WEB_URL || secrets.BETA_WEB_URL }}
        run: pnpm build

      - name: Génération du .zip
        if: steps.next_version.outputs.skip != 'true'
        run: |
          ZIP_NAME="actunime-sync-v${{ steps.next_version.outputs.version }}.zip"
          echo "Création de $ZIP_NAME"
          cd dist && zip -r "../dist/${ZIP_NAME}" . && cd ..
          ls -la dist/

      - name: Publication via semantic-release
        if: steps.next_version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm dlx semantic-release
